<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Git and GitHub Crash Course — version control learned through practical notes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Git &amp; GitHub Crash Course</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="1" stop-color="#0e1235"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.1" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#8b4dff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#8b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="mainLine" gradientUnits="userSpaceOnUse" x1="650" y1="0" x2="1150" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4f7bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6c63ff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowL)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#6c63ff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Title block -->
  <text x="64" y="68" fill="#22d3ee" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">VERSION CONTROL  ·  BRANCHES  ·  GITHUB</text>
  <text x="62" y="136" fill="url(#title)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" textLength="500" lengthAdjust="spacingAndGlyphs">GIT &amp; GITHUB</text>
  <text x="64" y="190" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="3" textLength="430" lengthAdjust="spacingAndGlyphs">CRASH COURSE</text>
  <text x="64" y="238" fill="#b3bddb" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" textLength="440" lengthAdjust="spacingAndGlyphs">Version control, learned through practical notes</text>

  <!-- Branch graph -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M650 100 H1150" stroke="url(#mainLine)" stroke-width="5"/>
    <path d="M750 100 C775 100 785 160 815 160 H965 C995 160 1005 100 1030 100" stroke="#a06bff" stroke-width="5"/>
    <path d="M1110 80 V92" stroke="#22d3a5" stroke-width="2"/>
  </g>
  <g stroke="#0a0f26" stroke-width="4">
    <circle cx="670" cy="100" r="11" fill="#22d3ee"/>
    <circle cx="750" cy="100" r="11" fill="#38a0ff"/>
    <circle cx="830" cy="160" r="10" fill="#a06bff"/>
    <circle cx="880" cy="160" r="10" fill="#a06bff"/>
    <circle cx="930" cy="160" r="10" fill="#a06bff"/>
    <circle cx="1030" cy="100" r="14" fill="#22d3a5"/>
    <circle cx="1110" cy="100" r="11" fill="#4f7bff"/>
  </g>
  <g font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="700">
    <text x="650" y="74" fill="#22d3ee">main</text>
    <text x="815" y="192" fill="#c4a8ff">feat/add-chat-support</text>
    <text x="1028" y="138" fill="#6ff0cf" text-anchor="middle">merge</text>
    <rect x="1082" y="56" width="56" height="22" rx="11" fill="#22d3a5" fill-opacity="0.16" stroke="#22d3a5" stroke-width="1.5"/>
    <text x="1110" y="72" fill="#6ff0cf" text-anchor="middle" font-size="12">HEAD</text>
  </g>

  <!-- Command pills -->
  <g font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="700">
    <g transform="translate(640 224)"><rect width="140" height="36" rx="18" fill="#0a0f26" stroke="#4f7bff" stroke-opacity="0.8" stroke-width="2"/><text x="16" y="24"><tspan fill="#22d3a5">$</tspan><tspan fill="#e8eeff"> git add .</tspan></text></g>
    <g transform="translate(796 224)"><rect width="164" height="36" rx="18" fill="#0a0f26" stroke="#8b4dff" stroke-opacity="0.8" stroke-width="2"/><text x="16" y="24"><tspan fill="#22d3a5">$</tspan><tspan fill="#e8eeff"> git commit</tspan></text></g>
    <g transform="translate(976 224)"><rect width="148" height="36" rx="18" fill="#0a0f26" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2"/><text x="16" y="24"><tspan fill="#22d3a5">$</tspan><tspan fill="#e8eeff"> git push</tspan></text></g>
  </g>

  <g fill="#22d3ee"><circle cx="590" cy="48" r="3" opacity="0.8"/><circle cx="1180" cy="200" r="2.5" opacity="0.6"/><circle cx="600" cy="280" r="2" opacity="0.5"/></g>
  <g fill="#8b4dff"><circle cx="1170" cy="30" r="2.5" opacity="0.7"/><circle cx="640" cy="196" r="2.5" opacity="0.6"/></g>
</svg>
